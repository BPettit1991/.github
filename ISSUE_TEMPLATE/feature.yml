name: Feature request
description: Suggest a new feature or a change to an existing one.
title: "[Feature]: "
labels: ["type: feature"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us what problem you want to solve. Do not include personal, client or participant data.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the problem, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What change do you propose?
    validations:
      required: true
  - type: input
    id: who
    attributes:
      label: Who benefits?
      placeholder: Staff, clients, participants, admin team
    validations:
      required: false
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: List the checks that prove the work is finished.
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High
        - Medium
        - Low
    validations:
      required: false
